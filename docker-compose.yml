name: cicada-v2-local

# Minimal local Hub only. The Hub image is built from Dockerfile.hub and has no
# Codex CLI, model/provider credentials, or legacy Control bearer. Linux host
# networking lets this development instance bind only to loopback without
# publishing a container port on every host interface.
services:
  hub:
    image: ${CICADA_HUB_IMAGE:-cicada-hub:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.hub
    network_mode: host
    restart: unless-stopped
    environment:
      CICADA_API_HOST: 127.0.0.1
      CICADA_API_PORT: ${CICADA_API_PORT:-8788}
      CICADA_STATE_DIR: /state
    volumes:
      - hub-state:/state
    command:
      - serve
      - --host
      - 127.0.0.1
      - --port
      - ${CICADA_API_PORT:-8788}
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null "http://127.0.0.1:$${CICADA_API_PORT}/healthz"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  hub-state:
    name: ${CICADA_HUB_VOLUME:-cicada-v2-local-hub-state}
