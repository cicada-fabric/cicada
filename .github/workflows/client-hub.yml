name: client-hub-contract

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-hub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0, Node 24
        with:
          go-version: '1.27.1'
          cache-dependency-path: cicada-go/go.sum
      - name: Contract bundle checks
        run: |
          python3 scripts/client-contract.py check
          python3 -m unittest discover -s scripts -p test_client_contract.py
          python3 scripts/client-contract.py export --output "$RUNNER_TEMP/client-contract"
      - name: Core, contract drift and published crypto vectors
        working-directory: cicada-go
        run: |
          test -z "$(gofmt -l .)"
          go test -count=1 ./...
          go vet ./...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: client-hub-contract-${{ github.sha }}
          path: ${{ runner.temp }}/client-contract/*.tar.gz
          if-no-files-found: error

  docker-interop:
    needs: contract-and-core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Disposable Hub protocol acceptance
        env:
          CICADA_BUILD_PROXY: ''
          CICADA_INTEROP_OUTPUT: ${{ runner.temp }}/cicada-client-interop
        run: scripts/test-client-hub-interop.sh
      - name: Disposable ACTIVE Network protocol acceptance
        if: always()
        env:
          CICADA_BUILD_PROXY: ''
          CICADA_INTEROP_OUTPUT: ${{ runner.temp }}/cicada-network-m1-interop
        run: scripts/test-client-hub-interop.sh --suite network-m1
      - name: Upload sanitized protocol evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: client-hub-interop-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cicada-client-interop/result.json
            ${{ runner.temp }}/cicada-client-interop/test.log
          if-no-files-found: error
      - name: Upload sanitized Network M1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: network-m1-interop-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cicada-network-m1-interop/result.json
            ${{ runner.temp }}/cicada-network-m1-interop/test.log
          if-no-files-found: error
