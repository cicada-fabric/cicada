# This file contains no credential. The API key is injected as API_KEY by
# docker-compose from /gpu1-share/data/cicada/secrets/cicada.env.
model = "gpt-5.5"
model_provider = "basil"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
log_dir = "/var/log/cicada/codex"

[model_providers.basil]
name = "Basil relay"
base_url = "https://basil.xin/v1"
env_key = "API_KEY"
wire_api = "responses"
request_max_retries = 4
stream_idle_timeout_ms = 300000
