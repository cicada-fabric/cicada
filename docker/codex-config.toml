# Development Codex CLI default. Runtime credentials are injected separately
# from the operator's protected environment file and are not part of the image.
model = "gpt-5.6-luna"
model_provider = "cicada-provider"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
log_dir = "/var/log/cicada/codex"

[model_providers.cicada-provider]
name = "CICADA configured provider"
base_url = "https://api.zzswitch.com/v1"
env_key = "API_KEY"
wire_api = "responses"
request_max_retries = 4
stream_idle_timeout_ms = 300000
