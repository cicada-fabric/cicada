    ClientTopologySetDirectoryPermission:
      type: object
      additionalProperties: false
      required: [group_id, membership_id, enabled, expected_membership_version]
      properties:
        group_id: {type: string, minLength: 1, maxLength: 256}
        membership_id: {type: string, minLength: 1, maxLength: 256}
        enabled: {type: boolean}
        expected_membership_version: {type: integer, minimum: 1, maximum: 9223372036854775806}
      description: >-
        Changes only explicit directory.read for an active same-Owner Principal
        Membership in an active Owner-controlled Network/Group on the current Hub.
        The accepted encrypted Client request, current Owner/device/key, scope and
        Membership CAS are checked in one write transaction. This applies to all
        joined Endpoints of that Principal in this Group, preserves roles and other
        grants, and advances Membership revision/version. It grants no peer traffic,
        key or history access and changes no native binding or context. Preview uses
        the read-only topology.snapshot; legacy management calls cannot apply it.

