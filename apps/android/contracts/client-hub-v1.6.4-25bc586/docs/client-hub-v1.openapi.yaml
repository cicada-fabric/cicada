        network_id: {type: string, minLength: 1}
        group_id: {type: string, minLength: 1}
        endpoint_id: {type: string, minLength: 1}
        expected_endpoint_migration_state: {type: string, enum: [READY, MIGRATION_PENDING_GROUP]}
        expected_network_version: {type: integer, minimum: 1}
        expected_group_version: {type: integer, minimum: 1}
        expected_network_membership_revision: {type: integer, minimum: 1}
        expected_endpoint_network_revision: {type: integer, minimum: 1}
        network_access_binding_id: {type: string, minLength: 1}
        network_access_epoch: {type: integer, minimum: 1}
        native_binding_id: {type: string, minLength: 1}
        native_binding_epoch: {type: integer, minimum: 1}
        existing_group_binding_id: {type: string}
        existing_group_binding_epoch: {type: integer, minimum: 0}
        expected_membership_revision: {type: integer, minimum: 0}
        expected_endpoint_group_revision: {type: integer, minimum: 0}
      description: >-
        Exact Owner-reviewed CAS tuple from topology.endpoint_admission_preview.
        The Hub rechecks current same-Owner Network/Endpoint enrollment and Node
        binding before making only a member Membership plus Group reference. It
        creates no Worker/Monitor grant, history grant, or Group key grant.

    TopologyEndpointAdmissionPreviewRequest:
      type: object
      additionalProperties: false
      required: [network_id, group_id, endpoint_id]
      properties:
        network_id: {type: string, minLength: 1}
        group_id: {type: string, minLength: 1}
        endpoint_id: {type: string, minLength: 1}

    TopologyEndpointAdmissionPreviewResult:
      type: object
      additionalProperties: false
      required: [owner_principal_id, network_id, network_name, network_version, group_id, group_name,
        group_version, group_context_policy, endpoint_id, endpoint_name, endpoint_principal_id,
        endpoint_migration_state, network_membership_revision, endpoint_network_revision,
        network_access_binding_id, network_access_epoch, native_binding_id, native_binding_epoch,
        membership_revision, endpoint_group_revision, admission_roles, admission_grants,
        history_included, key_grant_created, existing_thread_memory_retained]
      properties:
        owner_principal_id: {type: string}
        network_id: {type: string}
        network_name: {type: string}
        network_version: {type: integer, minimum: 1}
        group_id: {type: string}
        group_name: {type: string}
        group_version: {type: integer, minimum: 1}
        group_context_policy: {type: string}
        endpoint_id: {type: string}
        endpoint_name: {type: string}
        endpoint_principal_id: {type: string}
        endpoint_migration_state: {type: string, enum: [READY, MIGRATION_PENDING_GROUP]}
        network_membership_revision: {type: integer, minimum: 1}
        endpoint_network_revision: {type: integer, minimum: 1}
        network_access_binding_id: {type: string}
        network_access_epoch: {type: integer, minimum: 1}
        native_binding_id: {type: string}
        native_binding_epoch: {type: integer, minimum: 1}
        existing_group_binding_id: {type: string}
        existing_group_binding_epoch: {type: integer, minimum: 0}
        membership_status: {type: string}
        membership_revision: {type: integer, minimum: 0}
        endpoint_group_status: {type: string}
        endpoint_group_revision: {type: integer, minimum: 0}
        admission_roles: {type: array, const: [member], items: {type: string}}
        admission_grants: {type: array, maxItems: 0, items: {type: string}}
        history_included: {type: boolean, const: false}
        key_grant_created: {type: boolean, const: false}
        existing_thread_memory_retained: {type: boolean, const: true}
      description: >-
        Current-Hub same-Owner pre-consent review. This metadata does not include
        native locators, keys, historical records, or another Owner's data.

    ClientTopologyMember:
      type: object
      additionalProperties: false
      required: [membership_id, principal_id, group_id, role, broadcast_permission_enabled, directory_permission_enabled, status, version]
      properties:
        membership_id: {type: string}
        principal_id: {type: string}
        display_name: {type: string}
        group_id: {type: string}
        role: {type: string}
        roles:
          type: array
          items: {type: string}
        directory_permission_enabled:
          type: boolean
          description: Explicit directory.read grant configuration for this Principal Membership, shared by all its joined Endpoints in this Group; not a Guard decision.
        broadcast_permission_enabled:
          type: boolean
          description: Current explicit message.broadcast grant configuration; Monitor role alone does not enable it.
        status: {type: string}
        version: {type: integer, minimum: 1}

    TopologyCreateGroupAction:
      type: object
      additionalProperties: false
      required: [kind, create_group]
      properties:
        kind: {const: group.create}
        create_group:
          $ref: '#/components/schemas/ClientTopologyCreateGroup'

    ClientTopologyCreateGroup:
      type: object
      additionalProperties: false
      required: [group]
      properties:
        group:
          $ref: '#/components/schemas/ClientTopologyCreateGroupInput'
        parent_group_id: {type: string}
      description: Parent must belong to the same Network. A cross-Network parent is denied before insertion.

    ClientTopologyCreateGroupInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        network_id:
          type: string
          description: Required when Hub Network mode is ACTIVE; the authenticated Owner must own this active Network.
        name: {type: string, minLength: 1}
        purpose: {type: string}
        policy_ref: {type: string}
        context_policy: {type: string}
        isolation_profile: {type: string}
        external_mode: {type: string}

    ClientTopologySnapshot:
      type: object
      additionalProperties: false
      required: [contract_version, owner_principal_id, captured_at, read_consistency, networks_truncated, network_endpoints_truncated, networks, groups, memberships, endpoints, links]
      properties:
        contract_version: {const: 2}
        owner_principal_id: {type: string}
        captured_at: {type: string, format: date-time}
        read_consistency: {const: best_effort}
        networks_truncated: {type: boolean}
        network_endpoints_truncated: {type: boolean}
        networks:
          type: array
          items: {$ref: '#/components/schemas/ClientTopologyNetwork'}
        groups:
          type: array
          items: {$ref: '#/components/schemas/ClientTopologyGroup'}
        memberships:
          type: array
          items: {$ref: '#/components/schemas/ClientTopologyMember'}
        endpoints:
          type: array
          items: {$ref: '#/components/schemas/ClientTopologyEndpoint'}
        links:
          type: array
          items: {type: object}

    ClientTopologyNetwork:
      type: object
      additionalProperties: false
      required: [network_id, name, state, version, can_create_group]
      properties:
        network_id: {type: string}
        name: {type: string}
        state: {type: string, enum: [ACTIVE, PAUSED]}
        version: {type: integer, minimum: 1}
        can_create_group:
          type: boolean
          description: True only for an active Network owned by this authenticated Client Owner; it is not a separate authorization token.

    ClientTopologyGroup:
      type: object
      additionalProperties: false
      required: [group_id, name, state, context_policy, version]
      properties:
        group_id: {type: string}
        network_id: {type: string}
        parent_group_id: {type: string}
        name: {type: string}
        state: {type: string}
        context_policy: {type: string}
        version: {type: integer, minimum: 1}
      description: network_id is present for mapped Groups; PREPARING legacy unmapped Groups may omit it. context_policy names the current Thread context scope for Owner review.

    ClientTopologyEndpoint:
      type: object
      additionalProperties: false
      required: [endpoint_id, name, principal_id, group_ids, network_ids, presence]
      properties:
        endpoint_id: {type: string}
        name: {type: string}
        principal_id: {type: string}
        group_ids: {type: array, items: {type: string}}
        network_ids: {type: array, items: {type: string}}
        node_id: {type: string}
        harness: {type: string}
        native_session_id: {type: string}
        presence: {type: string}
        binding_id: {type: string}
        binding_epoch: {type: integer, minimum: 1}
        binding_status: {type: string}
      description: Only this Owner's Endpoints; Network-only Endpoints may have empty group_ids and no Group binding.

    NetworkDirectoryRequest:
      type: object
      additionalProperties: false
      required: [network_id]
      properties:
        network_id: {type: string, minLength: 1}
        after_endpoint_id: {type: string, maxLength: 256}
        limit: {type: integer, minimum: 1, maximum: 64, default: 64}
      description: >-
        Reads one page for this exact encrypted RPC request. Results include only
        opted-in Endpoints in an active Network owned by the authenticated Owner.
    NetworkDirectoryResult:
      type: object
      additionalProperties: false
      required: [network_id, endpoints]
      properties:
        network_id: {type: string}
        endpoints:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [network_id, endpoint_id, alias, presence]
            properties:
              network_id: {type: string}
              endpoint_id: {type: string}
              alias: {type: string}
              presence: {type: string, enum: [ACCESS_RECENT, UNKNOWN]}
        next_cursor: {type: string, maxLength: 256}
      description: >-
        Only currently enrolled, discoverable Endpoints that explicitly granted
        directory.publish are returned. Cards contain network_id, endpoint_id,
        alias and coarse presence only. They are read-only and confer no authority.

    NetworkCollaborationKeyManifestRequest:
      type: object
      additionalProperties: false
      required: [network_id, endpoint_id, purpose, owner_key_id]
      properties:
        network_id: {type: string, minLength: 1}
        endpoint_id: {type: string, minLength: 1}
        purpose: {type: string, enum: [TASK, BROADCAST]}
        owner_key_id: {type: string, minLength: 1}
      description: >-
        Previews a purpose-separated key-consent manifest for the exact current
        Endpoint enrollment and key candidate. This operation does not grant
        Task or Broadcast action permissions.
    NetworkCollaborationKeyGrantRequest:
      type: object
      additionalProperties: false
      required: [network_id, endpoint_id, purpose, signed_proof]
      properties:
        network_id: {type: string, minLength: 1}
        endpoint_id: {type: string, minLength: 1}
        purpose: {type: string, enum: [TASK, BROADCAST]}
        signed_proof:
          type: string
          contentEncoding: base64
          description: Complete canonical OwnerNetworkCollaborationKeyGrant JSON bytes.
      description: >-
        Accepts one current Owner signature for the exact Network, Endpoint,
        purpose and manifest digest. The accepted Client operation must be
        bound to network.collaboration_key_grant.
    NetworkCollaborationKeyStatusRequest:
      type: object
      additionalProperties: false
      required: [network_id, endpoint_id, purpose]
      properties:
        network_id: {type: string, minLength: 1}
        endpoint_id: {type: string, minLength: 1}
        purpose: {type: string, enum: [TASK, BROADCAST]}
    NetworkCollaborationKeyManifestResult:
      type: object
      additionalProperties: false
      required: [purpose, key_manifest, digest]
      properties:
        purpose: {type: string, enum: [TASK, BROADCAST]}
        key_manifest: {$ref: '#/components/schemas/NetworkKeyManifestResult'}
        digest: {type: string, pattern: '^[0-9a-f]{64}$'}
      description: >-
        The purpose is part of the outer digest. The Owner must independently
        verify the candidate self-attestation and signing bytes before signing.
    NetworkCollaborationKeyGrantResult:
      type: object
      additionalProperties: false
      required: [purpose, network_id, endpoint_id, owner_id, owner_key_id,
        manifest_digest, proof_digest, nonce, state, revision, accepted_at]
      properties:
        purpose: {type: string, enum: [TASK, BROADCAST]}
        network_id: {type: string}
        endpoint_id: {type: string}
        owner_id: {type: string}
        owner_key_id: {type: string}
        manifest_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        proof_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        nonce: {type: string, pattern: '^[0-9a-f]{64}$'}
        state: {type: string, enum: [active, stale, revoked]}
        revision: {type: integer, minimum: 1}
        accepted_at: {type: string, format: date-time}
      description: >-
        Purpose-specific consent metadata only. Task and Broadcast still
        require independent task.offer.* or broadcast.* authorization. It does
        not grant direct messaging and exposes no private key or peer payload.

    NetworkKeyManifestRequest:
      type: object
      additionalProperties: false
      required: [network_id, endpoint_id, owner_key_id]
      properties:
        network_id: {type: string, minLength: 1}
        endpoint_id: {type: string, minLength: 1}
        owner_key_id: {type: string, minLength: 1}

    NetworkKeyGrantRequest:
      type: object
      additionalProperties: false
      required: [network_id, endpoint_id, signed_proof]
      properties:
        network_id: {type: string, minLength: 1}
        endpoint_id: {type: string, minLength: 1}
        signed_proof:
          type: string
          contentEncoding: base64
          description: Complete canonical OwnerNetworkDirectKeyGrant JSON bytes, signed by the Owner key.

    NetworkKeyStatusRequest:
      type: object
      additionalProperties: false
      required: [network_id, endpoint_id]
      properties:
        network_id: {type: string, minLength: 1}
        endpoint_id: {type: string, minLength: 1}

    NetworkKeyCandidate:
      type: object
      additionalProperties: false
      required: [network_id, endpoint_id, principal_id, owner_id, node_id, binding_id, binding_epoch, public_identity, fingerprint, attestation, version]
      properties:
        network_id: {type: string}
        endpoint_id: {type: string}
        principal_id: {type: string}
        owner_id: {type: string}
        node_id: {type: string}
        binding_id: {type: string}
        binding_epoch: {type: integer, minimum: 1}
        public_identity: {$ref: '#/components/schemas/PublicIdentity'}
        fingerprint: {type: string}
        attestation: {type: string, contentEncoding: base64}
        version: {type: integer, minimum: 1}

    NetworkKeyManifestResult:
      type: object
      additionalProperties: false
      required: [version, hub_id, network_id, endpoint_id, principal_id, owner_id, node_id, native_session_id, native_session_digest, binding_id, binding_epoch, membership_revision, endpoint_enrollment_revision, candidate, digest]
      properties:
        version: {const: 1}
        hub_id: {type: string}
        network_id: {type: string}
        endpoint_id: {type: string}
        principal_id: {type: string}
        owner_id: {type: string}
        node_id: {type: string}
        native_session_id: {type: string}
        native_session_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        binding_id: {type: string}
        binding_epoch: {type: integer, minimum: 1}
        membership_revision: {type: integer, minimum: 1}
        endpoint_enrollment_revision: {type: integer, minimum: 1}
        candidate: {$ref: '#/components/schemas/NetworkKeyCandidate'}
        digest: {type: string, pattern: '^[0-9a-f]{64}$'}
      description: Only the authenticated Endpoint Owner can preview the raw native session ID; peer bundles omit it.

    NetworkKeyGrantResult:
      type: object
      additionalProperties: false
      required: [network_id, endpoint_id, owner_id, owner_key_id, manifest_digest, proof_digest, nonce, state, revision, accepted_at]
      properties:
        network_id: {type: string}
        endpoint_id: {type: string}
        owner_id: {type: string}
        owner_key_id: {type: string}
        manifest_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        proof_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        nonce: {type: string}
        state: {type: string, enum: [active, stale]}
        revision: {type: integer, minimum: 1}
        accepted_at: {type: string, format: date-time}

    NetworkKeyStatusResult:
      allOf:
        - $ref: '#/components/schemas/NetworkKeyGrantResult'
      description: The same record may report state=stale after a binding, enrollment, or candidate change.
