      x-session-chain-fields: forbidden
      x-header-schema-for-aead: '#/components/schemas/MonitorBroadcastSealedHeader'

    MonitorBroadcastEnvelopeV2:
      type: object
      additionalProperties: false
      required: [type, version, suite, context, sealed, signature]
      properties:
        type: {const: MONITOR_BROADCAST}
        version: {const: 2}
        suite: {const: ML-KEM-768+ML-DSA-65/AES-256-GCM}
        context:
          $ref: '#/components/schemas/MonitorBroadcastContextV2'
        sealed:
          $ref: '#/components/schemas/MonitorBroadcastSealedEnvelope'
        signature: {type: string, contentEncoding: base64}
      x-canonical-json-field-order: [type, version, suite, context, sealed, signature]
      x-signature-null-for-signing-bytes: true
      x-signing-prefix-utf8-hex: 6369636164612f636c69656e742f6d6f6e69746f722d62726f6164636173742f7369676e2f763100
      x-aad-prefix-utf8-hex: 6369636164612f636c69656e742f6d6f6e69746f722d62726f6164636173742f6161642f763100
      x-consent-array-empty-value: []
      x-consent-source-cross-checks:
        consent_scope.source.endpoint_id: context.monitor_endpoint_id
        consent_scope.source.owner_id: context.owner_id
        consent_scope.source.binding_id: context.monitor_binding_id
        consent_scope.source.binding_epoch: context.monitor_binding_epoch
        consent_scope.source.key_id: context.monitor_key_id
        consent_scope.consent_sha256: context.consent_sha256
      x-outer-and-inner-sequence-equality:
        - context.confirm_request_sequence
        - sealed.sequence
        - accepted_rpc_route.sequence
      description: >-
        Version 2 retains the v1 domain prefixes and E2EE primitives. Outer
        signing bytes use compact ordered JSON with signature:null. The AAD is
        the AAD prefix followed by compact ordered context JSON. AES-256-GCM
        key derivation is HKDF-SHA256(shared_secret, 32 zero bytes,
        UTF8("cicada/e2ee/v1/key") || uint64_be(sequence) || AAD, 32 bytes).
        GCM AAD appends the compact ordered MonitorBroadcastSealedHeader.

