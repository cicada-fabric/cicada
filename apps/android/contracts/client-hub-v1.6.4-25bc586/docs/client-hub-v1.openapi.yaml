    SessionCapabilities:
      type: object
      additionalProperties: false
      required: [owner_id, role, contract_revision, catalog_sha256, rpc_recovery, available_rpc_operations]
      properties:
        owner_id: {type: string, minLength: 1}
        role: {type: string, enum: [manager, external]}
        contract_revision: {const: client-hub-v1.6.4}
        catalog_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the exact embedded clientcontract/catalog.json bytes only.
        rpc_recovery: {const: true}
        available_rpc_operations:
          type: array
          items:
            $ref: '#/components/schemas/ClientRpcOperation'

    NodeLinkAuthorizationBundle:
      type: object
      additionalProperties: false
      required: [manifest, source_grant, target_grant, link_state]
      properties:
        manifest:
          $ref: '#/components/schemas/CommunicationLinkKeyManifest'
        source_grant:
          $ref: '#/components/schemas/CommunicationLinkAuthorizationProof'
        target_grant:
          $ref: '#/components/schemas/CommunicationLinkAuthorizationProof'
        link_state: {const: PROPOSED}

    ClientLinkKeyManifestRequest:
      type: object
      additionalProperties: false
      required: [link_id]
      properties:
        link_id: {type: string, minLength: 1, maxLength: 256}
    ClientLinkKeyGrantsRequest:
      type: object
      additionalProperties: false
      required: [link_id]
      properties:
        link_id: {type: string, minLength: 1, maxLength: 256}
    ClientLinkKeyGrantRequest:
      type: object
      additionalProperties: false
      required: [link_id, side, owner_key_id, signed_proof]
      properties:
        link_id: {type: string, minLength: 1, maxLength: 256}
        side: {type: string, enum: [SOURCE, TARGET]}
        owner_key_id: {type: string, minLength: 1, maxLength: 256}
        signed_proof: {type: string, contentEncoding: base64, maxLength: 21848}
    CommunicationLinkKeyGrantStatusList:
      type: array
      minItems: 2
      maxItems: 2
      items: {$ref: '#/components/schemas/CommunicationLinkKeyGrantStatus'}
    CommunicationLinkKeyGrantStatus:
      type: object
      additionalProperties: false
      required: [link_id, side, owner_id, accepted, current_status]
      properties:
        link_id: {type: string}
        side: {type: string, enum: [SOURCE, TARGET]}
        owner_id: {type: string}
        key_id: {type: string}
        manifest_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        accepted: {type: boolean}
        accepted_at: {type: string, format: date-time}
        current_status: {type: string, enum: [MISSING, ACCEPTED, KEY_BINDING_STALE, OWNER_KEY_REVOKED, PROOF_EXPIRED, INVALID, LEGACY_KEY_UNBOUND]}
        evidence: {$ref: '#/components/schemas/CommunicationLinkKeyGrantEvidence'}
      description: >-
        accepted records historical acceptance. Optional evidence is present only
        for currently verified ACCEPTED consent. Both sides in a list share one
        Store snapshot and verified_at. Consent does not establish routing or
        native consumption. A missing/stale/revoked/expired/corrupt proof omits
        evidence; do not reuse previously returned evidence as current authority.
    CommunicationLinkKeyGrantEvidence:
      type: object
      additionalProperties: false
      required: [link_version, contract_digest, manifest_digest, owner_key_id, owner_public_identity, owner_key_state, owner_key_version, signed_proof, verified_at]
      properties:
        link_version: {type: integer, minimum: 1}
        contract_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        manifest_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        owner_key_id: {type: string}
        owner_public_identity: {$ref: '#/components/schemas/PublicIdentity'}
        owner_key_state: {const: ACTIVE}
        owner_key_version: {type: integer, minimum: 1}
        signed_proof: {type: string, contentEncoding: base64, maxLength: 21848}
        verified_at: {type: string, format: date-time}
      description: >-
        Exact retained canonical OwnerLinkKeyGrant v2 proof and current public key
        metadata for this Link side only. Hub discovery evidence is not an
        independent trust anchor. Match an independently trusted Owner key or pin;
        never auto-trust the Hub key. Independently verify link.key_manifest and
        correlate its link/version/contract/digest with each signed side; reject
        any mismatch caused by separate-read races and refresh without signing.

    CommunicationLinkKeyManifest:
      type: object
      additionalProperties: false
      required: [version, link_id, link_version, contract_digest, contract_canonical, source, target, digest]
      properties:
        version: {type: integer, const: 2}
        link_id: {type: string}
        link_version: {type: integer, minimum: 1}
        contract_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        contract_canonical:
          type: string
          contentEncoding: base64
        source:
          $ref: '#/components/schemas/CommunicationLinkKeySide'
        target:
          $ref: '#/components/schemas/CommunicationLinkKeySide'
        digest: {type: string, pattern: '^[0-9a-f]{64}$'}

    LinkReviewPolicy:
      type: object
      additionalProperties: false
      required: [mode, reviewers, max_failovers, reviewer_lease_seconds, max_review_age_seconds]
      properties:
        mode: {type: string, enum: [NONE, METADATA]}
        reviewers:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [endpoint_id, group_id]
            properties:
              endpoint_id: {type: string, minLength: 1}
              group_id: {type: string, minLength: 1}
        max_failovers: {type: integer, minimum: 0, maximum: 8}
        reviewer_lease_seconds: {type: integer, minimum: 0, maximum: 3600}
        max_review_age_seconds: {type: integer, minimum: 0, maximum: 86400}
      description: >-
        For NONE all numeric fields and reviewers must be empty/zero. METADATA
        requires reviewers and bounds validated by the Hub. Reviewers see only
        bounded message metadata, never plaintext/ciphertext keys or prompt
        content; this does not claim to eliminate prompt-injection risk.

    LinkReviewPolicyPreviewRequest:
      type: object
      additionalProperties: false
      required: [link_id, policy]
      properties:
        link_id: {type: string, minLength: 1}
        policy: {$ref: '#/components/schemas/LinkReviewPolicy'}
    LinkReviewPolicyGrantRequest:
      type: object
      additionalProperties: false
      required: [link_id, owner_key_id, expected_policy_version, policy, signed_proof]
      properties:
        link_id: {type: string, minLength: 1}
        owner_key_id: {type: string, minLength: 1}
        expected_policy_version: {type: integer, minimum: 0, maximum: 9223372036854775806}
        policy: {$ref: '#/components/schemas/LinkReviewPolicy'}
        signed_proof:
          type: string
          contentEncoding: base64
          description: Complete canonical OwnerLinkReviewPolicyProof JSON signing policy_version equal to expected_policy_version + 1.
    LinkReviewPolicyStatusRequest:
      type: object
      additionalProperties: false
      required: [link_id]
      properties:
        link_id: {type: string, minLength: 1}
    LinkReviewPolicyPreviewResult:
      type: object
      additionalProperties: false
      required: [link_id, side, owner_id, contract_digest, link_version,
        expected_policy_version, policy_version, policy_digest, policy, maximum_proof_expires_at, verified_at, reviewer_qualifications]
      properties:
        link_id: {type: string}
        side: {type: string, enum: [SOURCE, TARGET]}
        owner_id: {type: string}
        contract_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        link_version: {type: integer, minimum: 1}
        expected_policy_version: {type: integer, minimum: 0, maximum: 9223372036854775806}
        policy_version: {type: integer, minimum: 1, maximum: 9223372036854775807}
        policy_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        policy: {$ref: '#/components/schemas/LinkReviewPolicy'}
        maximum_proof_expires_at: {type: string, format: date-time}
        verified_at: {type: string, format: date-time}
        reviewer_qualifications:
          type: array
          maxItems: 8
          items: {$ref: '#/components/schemas/LinkReviewerQualification'}
      description: >-
        One canonical UTC RFC3339Nano snapshot. Qualifications exactly match the
        normalized ordered requested reviewers; NONE returns an empty array.
        Each row is emitted after the current binding and real link.review Guard
        succeed. Submission rechecks authority; a lease is not a durable grant.
    LinkReviewerQualification:
      type: object
      additionalProperties: false
      required: [endpoint_id, group_id, membership_revision, join_revision,
        group_version, binding_id, binding_epoch, lease_expires_at, action]
      properties:
        endpoint_id: {type: string, minLength: 1}
        group_id: {type: string, minLength: 1}
        membership_revision: {type: integer, minimum: 1}
        join_revision: {type: integer, minimum: 1}
        group_version: {type: integer, minimum: 1}
        binding_id: {type: string, minLength: 1}
        binding_epoch: {type: integer, minimum: 1}
        lease_expires_at: {type: string, format: date-time}
        action: {const: link.review}
    LinkReviewPolicyOwnerEvidence:
      type: object
      additionalProperties: false
      required: [owner_key_id, owner_public_identity, owner_key_state,
        owner_key_version, signed_proof, accepted_at]
      properties:
        owner_key_id: {type: string, minLength: 1}
        owner_public_identity: {$ref: '#/components/schemas/PublicIdentity'}
        owner_key_state: {const: ACTIVE}
        owner_key_version: {type: integer, minimum: 1}
        signed_proof:
          type: string
          contentEncoding: base64
          maxLength: 21848
          description: Exact retained OwnerLinkReviewPolicyProof bytes, never reconstructed.
        accepted_at: {type: string, format: date-time}
    LinkReviewPolicyOwnerApproval:
      type: object
      additionalProperties: false
      required: [side, owner_id, current_status]
      properties:
        side: {type: string, enum: [SOURCE, TARGET]}
        owner_id: {type: string, minLength: 1}
        current_status: {type: string, enum: [MISSING, VERIFIED, OWNER_KEY_REVOKED, PROOF_EXPIRED, SCOPE_STALE, INVALID]}
        evidence: {$ref: '#/components/schemas/LinkReviewPolicyOwnerEvidence'}
      description: Evidence is present only for VERIFIED with current Link scope.
    LinkReviewPolicyStatusResult:
      type: object
      additionalProperties: false
      required: [link_id, link_version, contract_digest, policy_version, policy_digest, policy, current, accepted_sides, verified_at, owner_approvals]
      properties:
        link_id: {type: string}
        link_version: {type: integer, minimum: 1}
        contract_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        policy_version: {type: integer, minimum: 0}
        policy_digest: {type: string}
        policy: {$ref: '#/components/schemas/LinkReviewPolicy'}
        current: {type: boolean}
        accepted_sides: {type: array, maxItems: 2, items: {type: string, enum: [SOURCE, TARGET]}}
        verified_at: {type: string, format: date-time}
        owner_approvals:
          type: array
          maxItems: 2
          items: {$ref: '#/components/schemas/LinkReviewPolicyOwnerApproval'}
        expires_at: {type: string, format: date-time}
      description: >-
        Status selects the active head only. A grant result may describe its
        partial candidate; current requires exact active head and both verified
        sides. Configured approvals are SOURCE then TARGET; accepted_sides counts
        verified proofs only. Unconfigured version0 NONE has empty digest,
        accepted_sides and owner_approvals. Configured NONE still has approvals.
        Outer Link version/contract describe the current Link; policy tuple retains
        the selected head. Stale, revoked or expired heads return current=false with bounded policy
        metadata and per-side reasons; corrupt policy is rejected. No reviewed
        message body, ciphertext or native/model consumption is established.

